# Config.yaml
# Configuration file for Medical Image Anomaly Detection Project

# Basic settings
project_name: "MedicalAnomaly"
model_type: "vae"  # Options: "vae", "gan"
random_seed: 42
device: "cuda"  # Options: "cuda", "cpu"

# Dataset settings
dataset_path: "./Dataset"
image_size: 128
input_channels: 1
batch_size: 16
num_workers: 4

# Model hyperparameters
latent_dim: 128
filters: [32, 64, 128, 256]

# Training parameters
max_epochs: 100
learning_rate: 1e-4
weight_decay: 1e-4
scheduler_patience: 5
scheduler_factor: 0.5
early_stopping_patience: 15

# VAE specific
kld_weight: 0.5  # Weight for KL divergence term in VAE loss

# GAN specific
gan_lr: 2e-4    # Learning rate for GAN optimizer
gan_beta1: 0.5  # Beta1 for Adam optimizer

# Anomaly detection
anomaly_threshold: 0.5  # Threshold for anomaly detection
reconstruction_weight: 0.7  # Weight for reconstruction error in anomaly score
feature_weight: 0.3  # Weight for feature matching error in anomaly score

# Logging
log_dir: "./Logs"
model_dir: "./Model"
log_interval: 10  # Log every N batches
save_interval: 5  # Save model every N epochs
visualization_samples: 8  # Number of samples to visualize